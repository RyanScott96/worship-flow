name: CI

on:
  pull_request:
  push:
    branches: [main, development]

# One run per branch/PR; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks # branch-protection status-check context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # match Vercel's runtime
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # `next build`, not `vercel-build` — CI has no database and never migrates.
      # Every DB-backed route is dynamic, so the build needs no DATABASE_URL.
      - name: Build
        run: npm run build

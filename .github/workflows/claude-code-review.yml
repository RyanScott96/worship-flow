name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]

# One review per PR; a newer run supersedes an in-flight one. Note the trigger
# deliberately omits `synchronize` — review on open / ready-for-review only, not
# on every push, to keep API spend bounded.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Billed against the Claude Pro/Max subscription, not API credits.
          # Generate with `claude setup-token`; rotate when it expires.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The branch is already checked out.

            Read CLAUDE.md first and honour it — the non-negotiables (ChordPro is
            canonical storage; key lives on service_item; scans retained forever)
            and the "boring over clever, bus factor first" ethos.

            Report, in priority order:
            - Correctness bugs: wrong output, crashes, unhandled cases, race
              conditions, migration and data-integrity hazards.
            - lib/transpose and lib/chordpro are the tested core and must stay a
              pure library — flag any I/O or framework import added there, and any
              behaviour change with no test.
            - Security: SQL assembled by string concatenation, unvalidated input
              reaching the DB or filesystem, secrets committed.
            - Only then: clear simplifications and dead code.

            Be terse. No style nitpicks, no praise. If the PR is clean, say so in
            one line and stop.

            Post the summary with `gh pr comment` and specific findings with
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`). Post only GitHub comments — do not return the
            review as a message.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
